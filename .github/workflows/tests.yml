name: Tests

# Runs automatically on every push (any branch) and on pull requests.
on:
  push:
  pull_request:

# Cancel an in-progress run when new commits are pushed to the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # convex/_generated is committed, so the typecheck runs without a
      # Convex deployment.
      - name: Typecheck
        run: npm run typecheck

      # Fails on errors only. Warnings are the tracked convention backlog —
      # tests/structure/conventions.test.ts owns that ratchet, so warning here
      # would duplicate it and go red on day one. See eslint.config.mjs.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
