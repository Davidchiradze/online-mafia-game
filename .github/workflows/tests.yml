name: Tests

# Runs automatically on every push (any branch) and on pull requests.
on:
  push:
  pull_request:

# Cancel an in-progress run when new commits are pushed to the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # convex/_generated is committed, so the typecheck runs without a
      # Convex deployment.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
